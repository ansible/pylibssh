---

codecov:
  notify:
    after_n_builds: 26  # Number of test matrix+lint jobs uploading coverage
    wait_for_ci: false

  require_ci_to_pass: false

  token: >-  # notsecret  # repo-scoped, upload-only, stability in fork PRs
    78c6cd01-1f6b-428a-8be0-9069e6073d6d

comment:
  require_changes: true

coverage:
  range: 100..100
  status:
    patch:
      default:
        target: 100%
    project:
      default:
        target: 79.32%  # 100%
      lib-combined:
        paths:
        - src/
        target: 67.30%  # 100%
      lib-cython:
        paths:
        - src/**/*.pyx
        target: 67.37%  # 100%
      lib-python:
        paths:
        - src/**/*.py
        target: 65.00%  # 100%
      packaging:
        paths:
        - packaging/
        target: 50.00%  # 100%
      tests:
        paths:
        - tests/
        target: 98.76%  # 100%

...
