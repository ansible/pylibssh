[tool.cibuildwheel]
# Build for these architectures
archs = ["x86_64", "aarch64", "ppc64le", "s390x"]

# Skip building PyPy wheels and Python 3.8 (project requires 3.9+)
skip = ["pp*", "cp38-*"]

# Build only for Linux (since libssh is primarily used on Linux servers)
build = ["cp39-*", "cp310-*", "cp311-*", "cp312-*"]

# Environment variables for all platforms
environment = { CYTHON_TRACE="1" }

[tool.cibuildwheel.linux]
# Use manylinux2014 for better compatibility with older systems
manylinux-x86_64-image = "manylinux2014"
manylinux-aarch64-image = "manylinux2014"
manylinux-ppc64le-image = "manylinux2014"
manylinux-s390x-image = "manylinux2014"

# Install libssh dependencies before building
before-all = [
    # Update package manager
    "yum update -y || apt-get update -y",

    # Install libssh development packages
    "yum install -y libssh-devel openssl-devel cmake gcc-c++ || apt-get install -y libssh-dev libssl-dev cmake build-essential",

    # For some architectures, we might need to build libssh from source
    "bash {project}/build-scripts/install-libssh.sh"
]

# Test the built wheels
test-command = "python -c 'import pylibssh.api; print(\"Import successful\")'"
test-requires = ["pytest"]

[tool.cibuildwheel.macos]
# Skip macOS for now since libssh setup is more complex
skip = ["*"]

[tool.cibuildwheel.windows]
# Skip Windows for now since libssh setup is more complex
skip = ["*"]