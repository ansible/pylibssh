[mypy]
python_version = 3.9
color_output = true
error_summary = true
files =
  docs/,
  packaging/,
  src/,
  tests/,

check_untyped_defs = true

disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true

enable_error_code =
  ignore-without-code

explicit_package_bases = true

extra_checks = true

follow_imports = normal

ignore_missing_imports = false

local_partial_types = true

mypy_path = ${MYPY_CONFIG_FILE_DIR}/packaging:${MYPY_CONFIG_FILE_DIR}/src:${MYPY_CONFIG_FILE_DIR}/tests:${MYPY_CONFIG_FILE_DIR}/_type_stubs

namespace_packages = true

no_implicit_reexport = true

pretty = true

show_column_numbers = true
show_error_code_links = true
show_error_codes = true
show_error_context = true
show_error_end = true

# `strict` will pick up any future strictness-related settings:
strict = true
strict_equality = true
strict_optional = true

warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[mypy-pylibsshext._libssh_version,pylibsshext._scm_version,pylibsshext.channel,pylibsshext.errors,pylibsshext.logging,pylibsshext.scp,pylibsshext.session,pylibsshext.sftp]
# FIXME: Drop this once there are `.pyi` stubs for the Cython modules,
# FIXME: which MyPy cannot analyze, and the build-time generated
# FIXME: `_scm_version` module.
ignore_missing_imports = true
