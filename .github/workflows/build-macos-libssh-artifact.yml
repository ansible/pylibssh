---

name: 🍎 macOS libssh

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
  schedule:
  - cron: 0 0 * * FRI
  pull_request:
    paths:
    - .github/workflows/build-macos-libssh-artifact.yml
    # Contains the OpenSSL version we'll build
    - build-scripts/manylinux-container-image/openssl-version.sh
  push:
    branches:
    - devel
    paths:
    - .github/workflows/build-macos-libssh-artifact.yml
    # Contains the OpenSSL version we'll build
    - build-scripts/manylinux-container-image/openssl-version.sh

env:
  LIBSSH_VERSION: 0.12.2

jobs:
  build:
    name: "Build libssh for macOS (${{ matrix.ARCH.NAME }})"
    runs-on: macos-15
    timeout-minutes: 10
    strategy:
      matrix:
        ARCH:
        - NAME: x86_64
          ARTIFACT_NAME: x86-64
          CFLAGS: "-mmacosx-version-min=10.12 -march=core2"
          OPENSSLDIR: "/usr/local/etc/openssl@3"
        - NAME: arm64
          ARTIFACT_NAME: arm64
          CFLAGS: "-mmacosx-version-min=11.0"
          OPENSSLDIR: "/opt/homebrew/etc/openssl@3"
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Download OpenSSL
      run: |
        source ./build-scripts/manylinux-container-image/openssl-version.sh
        curl -Lo openssl.tar.gz \
          "https://github.com/openssl/openssl/releases/download/${OPENSSL_VERSION}/${OPENSSL_VERSION}.tar.gz"
        shasum -a 256 -c <<< "${OPENSSL_SHA256} *openssl.tar.gz"
    - name: Extract OpenSSL
      run: tar zxf openssl.tar.gz
    - name: Build OpenSSL
      run: |
        set -x
        source ./build-scripts/manylinux-container-image/openssl-version.sh
        mkdir artifact
        BASEDIR="$(pwd)"
        cd openssl*/
        # Use the brew openssldir so pyopenssl users with homebrew installed
        # will have roots for TLS. This is obviously not great but we live in
        # an imperfect world.
        perl ./Configure \
          --prefix="${BASEDIR}/artifact" \
          --openssldir="${{ matrix.ARCH.OPENSSLDIR }}" \
          darwin64-${{ matrix.ARCH.NAME }}-cc \
          ${OPENSSL_BUILD_FLAGS} \
          ${MACOS_CFLAGS}
        make -j"$(sysctl -n hw.logicalcpu)"
        make install_sw
      env:
        MACOS_CFLAGS: ${{ matrix.ARCH.CFLAGS }}

    - name: Fetch libssh src
      run: >-
        git clone --depth=1
        -b "libssh-${{ env.LIBSSH_VERSION }}"
        https://gitlab.com/libssh/libssh-mirror.git
        libssh-src
    - name: Build libssh
      run: |
        set -x
        BASEDIR="$(pwd)"
        cmake \
          -S libssh-src \
          -B libssh-build \
          -DCMAKE_BUILD_TYPE=MinSizeRel \
          -DBUILD_SHARED_LIBS=ON \
          -DCMAKE_INSTALL_PREFIX="${BASEDIR}/artifact" \
          -DCMAKE_OSX_ARCHITECTURES="${{ matrix.ARCH.NAME }}" \
          -DOPENSSL_ROOT_DIR="${BASEDIR}/artifact" \
          -DCLIENT_TESTING=OFF \
          -DSERVER_TESTING=OFF \
          -DUNIT_TESTING=OFF \
          -DWITH_EXAMPLES=OFF \
          -DWITH_GSSAPI=ON \
          -DWITH_SERVER=OFF \
          -DWITH_PCAP=OFF \
          -DWITH_ZLIB=ON
        cmake --build libssh-build --parallel "$(sysctl -n hw.logicalcpu)"
        cmake --install libssh-build --strip
      env:
        CFLAGS: ${{ matrix.ARCH.CFLAGS }}
        PKG_CONFIG_PATH: >-
          ${{ github.workspace }}/artifact/lib/pkgconfig

    - uses: actions/upload-artifact@v7
      with:
        name: "libssh-macos-${{ matrix.ARCH.ARTIFACT_NAME }}"
        path: artifact/

  universal2:
    name: "Build libssh for macOS universal2"
    needs:
    - build
    runs-on: macos-15
    timeout-minutes: 2
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/download-artifact@v8
      with:
        name: libssh-macos-x86-64
        path: x86-64
    - uses: actions/download-artifact@v8
      with:
        name: libssh-macos-arm64
        path: arm64
    - name: Create universal2 libssh + OpenSSL
      run: |
        set -x
        mkdir -p artifact/lib
        cp -r x86-64/include artifact/
        cp -r x86-64/lib/pkgconfig artifact/lib/
        for lib_path in x86-64/lib/*.a x86-64/lib/*.dylib; do
          lib="${lib_path##*/}"
          lipo -create -output "artifact/lib/${lib}" \
            "x86-64/lib/${lib}" "arm64/lib/${lib}"
        done
    - uses: actions/upload-artifact@v7
      with:
        name: libssh-v${{ env.LIBSSH_VERSION }}-macos-universal2
        path: artifact/

...
