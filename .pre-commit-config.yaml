- repo: https://github.com/pre-commit/mirrors-mypy.git
  rev: v1.20.2  # the last MyPy version to support Python 3.9
  hooks:
  - id: mypy
    alias: mypy-py39
    name: MyPy 1.20.2, for Python 3.9
    additional_dependencies:
    - Cython
    - lxml  # dep of `--txt-report`, `--cobertura-xml-report` & `--html-report`
    - proxy.py
    - pytest < 9  # the last series to support Python 3.9
    - setuptools-scm
